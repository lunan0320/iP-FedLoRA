data_config:
  dataset_name: glue


federated_config:
  alpha: 5
  clients_num: 10
  rounds: 30
  sample: 0.5
  test_rounds: False
  log_test_len: 10


model_config:
  model_type: roberta
  model_name_or_path: "./pretrain/nlp/roberta-base/"

  # model_type: deberta
  # model_name_or_path: "./pretrain/nlp/debertav3"

  # model_type: llama3
  # model_name_or_path: "./pretrain/nlp/llama3-3b"

  finetune_list: [0,64,32,16,8,1]
  
training_config:
  train_method: knowledge 
  reg: True
  mini_rounds: 1                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
  metric_name: glue
  seed: 42

dp_config:
  dp_method: AdaDP
  epsilon: 8
  delta: 1e-5
  mode: rdp 
  max_clip: 0.2 
  lam: 3.2
  gamma: 0.1


